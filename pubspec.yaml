name: jordan_tourism
description: Jordan Tourism App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  video_player: ^2.8.1
  audioplayers: ^5.2.1
  flutter_rating_bar: ^4.0.1
  share_plus: ^7.2.1
  url_launcher: ^6.2.1
  rename: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/videos/
    - assets/audio/